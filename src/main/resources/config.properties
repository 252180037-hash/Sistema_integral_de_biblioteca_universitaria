# ===================================================================
# SIBU - Sistema Integral de Biblioteca Universitaria
# Archivo de Configuración Interna por Defecto (Classpath)
# ===================================================================

db.host=localhost
db.port=3306
db.name=sibu_db
db.url=jdbc:mysql://localhost:3306/sibu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

backup.dir=backups
mysqldump.path=C:/Program Files/MariaDB 13.0/bin/mysqldump.exe
mysql.path=C:/Program Files/MariaDB 13.0/bin/mysql.exe

app.multa.diaria=5.00
app.prestamo.dias_limite=7
app.prestamo.max_libros=3
app.prestamo.renovaciones_max=1

app.tema.default=LIGHT
