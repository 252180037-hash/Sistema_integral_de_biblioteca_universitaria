# ===================================================================
# SIBU - Sistema Integral de Biblioteca Universitaria
# Archivo de Configuración Externa (ISO/IEC 25010:2023 - Flexibilidad)
# ===================================================================

# Configuración de Conexión a Base de Datos MySQL / MariaDB
db.host=localhost
db.port=3306
db.name=sibu_db
db.url=jdbc:mysql://localhost:3306/sibu_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.user=root
db.password=

# Rutas de Respaldo y Restauración
# El sistema soporta detección automática y respaldo JDBC puro como fallback
backup.dir=backups
mysqldump.path=C:/Program Files/MariaDB 13.0/bin/mysqldump.exe
mysql.path=C:/Program Files/MariaDB 13.0/bin/mysql.exe

# Parámetros de Negocio y Circulación
# Monto de sanción diaria por día de atraso (en moneda local)
app.multa.diaria=5.00
# Días límite permitidos por cada préstamo
app.prestamo.dias_limite=7
# Límite máximo de libros simultáneos por lector
app.prestamo.max_libros=3
# Número máximo de renovaciones permitidas por préstamo
app.prestamo.renovaciones_max=1

# Configuración de Interfaz de Usuario
# Opciones disponibles: LIGHT, DARK
app.tema.default=LIGHT
